<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pediatria V · hub nauki do zaliczenia</title>
<meta name="description" content="Jeden hub łączący wszystkie atlasy modułowe z pediatrii: czytanie, trening mieszany, baza pytań, mapa powiązań i postęp.">
<meta name="theme-color" content="#F5F6F2">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://api.fontshare.com">
<link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700&f[]=cabinet-grotesk@700,800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/hub.css">
<script>
try{const t=localStorage.getItem('pediatria_hub_theme')||'auto';if(t==='dark'||(t==='auto'&&window.matchMedia('(prefers-color-scheme: dark)').matches))document.documentElement.dataset.theme='dark';}catch(e){}
</script>
</head>
<body>
<a class="sr" href="#view">Przejdź do treści</a>
<header class="bar">
  <div class="wrap">
    <a class="logo" href="#/" aria-label="Pediatria V – strona główna"><i aria-hidden="true"><b></b><b></b><b></b><b></b></i>Pediatria<small>V rok</small></a>
    <ul class="menu" id="menu" aria-label="Główna nawigacja">
      <li><a href="#/" data-r="start">Start</a></li>
      <li><a href="#/atlasy" data-r="atlasy">Atlasy</a></li>
      <li><a href="#/trening" data-r="trening">Trening</a></li>
      <li><a href="#/egzamin" data-r="egzamin">Egzamin</a></li>
      <li><a href="#/pytania" data-r="pytania">Pytania</a></li>
      <li><a href="#/notatki" data-r="notatki">Notatki</a></li>
      <li><a href="#/polaczenia" data-r="polaczenia">Połączenia</a></li>
      <li><a href="#/postep" data-r="postep">Postęp</a></li>
    </ul>
    <button class="pwa-install" id="btnInstall" aria-label="Zainstaluj aplikację" style="display:none"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg><span>Zainstaluj</span></button>
    <button class="srch btn-theme" id="btnTheme" aria-label="Zmień motyw" title="Motyw: Auto (systemowy)"><span id="themeIcon">🖥️</span><span id="themeLabel">Auto</span></button>
    <button class="srch" id="openPal" aria-label="Szukaj w całym hubie"><svg width="16" height="16" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="8" cy="8" r="6"/><path d="m13 13 4 4"/></svg><span>Szukaj</span><kbd>Ctrl K</kbd></button>
  </div>
</header>
<main id="view" tabindex="-1"></main>
<footer class="ft" id="ft"></footer>
<dialog class="pal" id="pal" aria-label="Szukaj w hubie">
  <input id="palIn" type="search" placeholder="Szukaj modułu, sekcji atlasu lub pytania…" autocomplete="off" aria-label="Szukaj">
  <ul id="palList" role="listbox"></ul>
</dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<!-- Podręczny notatnik (Quick Notes Drawer & FAB) -->
<button class="fab-notes" id="btnQuickNotes" aria-label="Otwórz szybki brudnopis" title="Szybki brudnopis (Markdown)">
  <span class="fab-icon">📝</span>
  <span class="fab-label">Brudnopis</span>
</button>

<aside class="drawer-notes" id="notesDrawer" aria-label="Szybki notatnik Markdown" hidden>
  <div class="drawer-header">
    <div class="drawer-title">
      <span>📝 Szybki brudnopis</span>
      <span class="chip-sm" id="scratchSavedStatus">Zapisano</span>
    </div>
    <div class="drawer-actions">
      <a href="#/notatki" class="btn-icon" id="drawerOpenFull" title="Otwórz pełny notatnik">↗</a>
      <button class="btn-icon" id="drawerClose" aria-label="Zamknij brudnopis">✕</button>
    </div>
  </div>
  <div class="drawer-toolbar">
    <button type="button" data-md="b" title="Pogrubienie (Ctrl+B)"><b>B</b></button>
    <button type="button" data-md="i" title="Kursywa (Ctrl+I)"><i>I</i></button>
    <button type="button" data-md="h2" title="Nagłówek">H2</button>
    <button type="button" data-md="list" title="Lista punktowana">•</button>
    <button type="button" data-md="check" title="Lista zadań">☑</button>
    <button type="button" data-md="table" title="Tabela">▦</button>
    <div style="flex:1"></div>
    <button type="button" id="drawerToggleMode" class="btn-sm-text">Podgląd</button>
  </div>
  <div class="drawer-body">
    <textarea id="drawerInput" placeholder="Szybkie notatki, dawki, objawy, pułapki (Markdown)..."></textarea>
    <div id="drawerPreview" class="md-preview" hidden></div>
  </div>
  <div class="drawer-footer">
    <button type="button" class="btn sec sm" id="drawerSaveAsNote">Zapisz do notatek</button>
    <button type="button" class="btn sec sm" id="drawerClear" style="color:var(--red)">Wyczyść</button>
  </div>
</aside>

<script src="js/meta.js"></script>
<script src="js/questions.js"></script>
<script src="js/app.js"></script>
</body>
</html>
